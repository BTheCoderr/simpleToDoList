name: Command Center CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install test tooling
        run: npm install --no-audit --no-fund
      - name: Run release gate
        run: npm run check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install test tooling
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser QA
        run: npm run e2e
      - name: Wait for Netlify v7.3
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[prod-smoke]'))
        run: |
          for i in {1..36}; do
            if curl -fsS https://command-center-local.netlify.app/storage.js | grep -q 'APP_VERSION="7.3.0"' && curl -fsS https://command-center-local.netlify.app/style.css | grep -q 'v7.3 mobile Tasks overflow fix'; then
              echo "v7.3 mobile Tasks fix is live"
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for Netlify v7.3"
          exit 1
      - name: Smoke test production
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[prod-smoke]'))
        env:
          PLAYWRIGHT_BASE_URL: https://command-center-local.netlify.app
        run: npx playwright test tests/production.spec.mjs
      - name: Upload production visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-visual-checks
          path: test-results/production-*.png
          if-no-files-found: ignore
