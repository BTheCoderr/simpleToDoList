name: Force Netlify Production Deploy

on:
  push:
    branches: [master]

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore one-time deploy credential
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .deploy-secret
          curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/11085809182/zip"             -o .deploy-secret/key.zip
          unzip -q .deploy-secret/key.zip -d .deploy-secret/key
          base64 -d .github/netlify/proxy.enc.b64 > .deploy-secret/proxy.enc
          openssl enc -d -aes-256-cbc -pbkdf2             -in .deploy-secret/proxy.enc             -out .deploy-secret/proxy.txt             -pass file:.deploy-secret/key/netlify-deploy.key
      - name: Deploy v6.2 to existing Netlify site
        run: |
          set -euo pipefail
          PROXY_PATH="$(cat .deploy-secret/proxy.txt)"
          npx -y @netlify/mcp@latest             --site-id 03e891f0-2327-495b-b55e-2e95b3ddbeb4             --proxy-path "$PROXY_PATH"
          rm -rf .deploy-secret
      - name: Verify live release
        run: |
          set -euo pipefail
          for i in {1..24}; do
            if curl -fsSL https://command-center-local.netlify.app/storage.js | grep -q 'APP_VERSION="6.2.0"'; then
              exit 0
            fi
            sleep 5
          done
          echo "v6.2 did not appear on production" >&2
          exit 1
