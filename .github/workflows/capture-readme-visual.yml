name: Capture Command Center README Visual

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  capture:
    if: contains(github.event.head_commit.message, '[capture-readme-visual]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install test tooling
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture local product visuals
        run: |
          mkdir -p docs/branding
          python3 -m http.server 4000 -d public >/tmp/command-center-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4000/ >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'EOF'
          import { chromium } from "@playwright/test";
          const browser=await chromium.launch({headless:true});

          const desktop=await browser.newPage({viewport:{width:1440,height:900}});
          await desktop.addInitScript(()=>{
            localStorage.setItem("cc-onboarded-v1","1");
            localStorage.setItem("cc-theme","light");
          });
          await desktop.goto("http://127.0.0.1:4000/?view=today",{waitUntil:"networkidle"});
          await desktop.screenshot({path:"docs/branding/command-center-desktop.png",fullPage:true});

          const mobile=await browser.newPage({viewport:{width:390,height:844}});
          await mobile.addInitScript(()=>{
            localStorage.setItem("cc-onboarded-v1","1");
            localStorage.setItem("cc-theme","light");
          });
          await mobile.goto("http://127.0.0.1:4000/?view=tasks",{waitUntil:"networkidle"});
          await mobile.screenshot({path:"docs/branding/command-center-mobile.png",fullPage:true});

          await browser.close();
          EOF
      - name: Commit visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/branding/command-center-desktop.png docs/branding/command-center-mobile.png
          if git diff --cached --quiet; then
            echo "No visual changes"
            exit 0
          fi
          git commit -m "docs: add Command Center product visuals [skip ci] [skip netlify]"
          git push
