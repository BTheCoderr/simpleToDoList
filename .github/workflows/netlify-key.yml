name: Prepare Netlify Deploy Key

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  key:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate one-time key
        run: |
          umask 077
          openssl rand -hex 32 > netlify-deploy.key
      - name: Upload protected key artifact
        uses: actions/upload-artifact@v4
        with:
          name: netlify-deploy-key
          path: netlify-deploy.key
          retention-days: 1
